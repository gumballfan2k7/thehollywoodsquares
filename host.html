<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host Controller Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .star-name-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        .star-input-group {
            display: flex;
            flex-direction: column;
        }
        .star-input-group label {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 2px;
        }
        .star-input-group input {
            text-transform: uppercase;
            font-weight: bold;
            padding: 6px;
            text-align: center;
        }
    </style>
</head>
<body class="host-body">

    <h1>🎙️ HOST CONTROLLER PANEL</h1>

    <div class="host-container">
        
        <!-- 1. Star Names Setup -->
        <div class="panel-section" style="grid-column: span 2;">
            <h3>⭐ 1. Star Names Setup (ALL CAPS & BOLD)</h3>
            <div class="star-name-grid">
                <div class="star-input-group"><label>Square 1</label><input type="text" id="star-name-0" placeholder="STAR 1"></div>
                <div class="star-input-group"><label>Square 2</label><input type="text" id="star-name-1" placeholder="STAR 2"></div>
                <div class="star-input-group"><label>Square 3</label><input type="text" id="star-name-2" placeholder="STAR 3"></div>
                <div class="star-input-group"><label>Square 4</label><input type="text" id="star-name-3" placeholder="STAR 4"></div>
                <div class="star-input-group"><label>Square 5</label><input type="text" id="star-name-4" placeholder="STAR 5"></div>
                <div class="star-input-group"><label>Square 6</label><input type="text" id="star-name-5" placeholder="STAR 6"></div>
                <div class="star-input-group"><label>Square 7</label><input type="text" id="star-name-6" placeholder="STAR 7"></div>
                <div class="star-input-group"><label>Square 8</label><input type="text" id="star-name-7" placeholder="STAR 8"></div>
                <div class="star-input-group"><label>Square 9</label><input type="text" id="star-name-8" placeholder="STAR 9"></div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="button" onclick="saveStarNames()" style="background: #3b82f6; color: #fff; flex: 1;">💾 Save / Update Names</button>
                <button type="button" onclick="revealAllStarNames()" style="background: #10b981; color: #fff; flex: 1;">👁️ Reveal All Names</button>
                <button type="button" onclick="hideAllStarNames()" style="background: #ef4444; color: #fff; flex: 1;">🙈 Hide All Names</button>
            </div>
        </div>

        <!-- 2. Turn & Square Selection -->
        <div class="panel-section">
            <h3>2. Turn & Highlight Pick</h3>
            <button id="btn-turn-x" class="btn-x btn-active" onclick="setTurn('X')" style="width: 48%;">Player X</button>
            <button id="btn-turn-o" class="btn-o" onclick="setTurn('O')" style="width: 48%;">Player O</button>

            <h3 style="margin-top: 15px;">Pick Square to Highlight</h3>
            <div class="host-grid">
                <button class="sq-btn" onclick="selectSquare(0)">Square 1</button>
                <button class="sq-btn" onclick="selectSquare(1)">Square 2</button>
                <button class="sq-btn" onclick="selectSquare(2)">Square 3</button>
                <button class="sq-btn" onclick="selectSquare(3)">Square 4</button>
                <button class="sq-btn" onclick="selectSquare(4)">Square 5</button>
                <button class="sq-btn" onclick="selectSquare(5)">Square 6</button>
                <button class="sq-btn" onclick="selectSquare(6)">Square 7</button>
                <button class="sq-btn" onclick="selectSquare(7)">Square 8</button>
                <button class="sq-btn" onclick="selectSquare(8)">Square 9</button>
            </div>
            <button class="action-btn clear-glow" onclick="clearGlow()">Turn Off Glow</button>
        </div>

        <!-- 3. Question Content & Live Typing -->
        <div class="panel-section">
            <h3>3. Question Content</h3>
            
            <div style="background: #2b2b3d; padding: 10px; border-radius: 6px; margin-bottom: 10px;">
                <label><strong>1. Get Excel Template:</strong></label>
                <button type="button" onclick="downloadTemplate()" style="background: #10b981; color: #fff; width: 100%; margin: 5px 0 10px 0;">📥 Download 2-Column Template (.xlsx)</button>
                
                <label><strong>2. Upload Completed Excel File:</strong></label>
                <input type="file" id="excel-input" accept=".xlsx, .xls" onchange="handleExcelUpload(event)">
            </div>

            <label>Select Loaded Question:</label>
            <select id="question-select" onchange="loadSelectedQuestion()">
                <option value="">-- Select a Question --</option>
            </select>

            <label>Trivia Question:</label>
            <textarea id="input-q" rows="2" placeholder="e.g. What color is polar bear skin?"></textarea>

            <label>Actual True Answer:</label>
            <input type="text" id="input-truth" placeholder="e.g. Black!">

            <hr>
            <label style="color: #ffd700; font-size: 1.1rem;"><strong>🎙️ Type Star's Live Answer:</strong></label>
            <input type="text" id="input-star" placeholder="Type what the star says live..." style="border: 2px solid #ffd700;">
        </div>

        <!-- 4. Screen Reveals -->
        <div class="panel-section">
            <h3>4. Screen Reveals</h3>
            <button class="reveal-btn" onclick="showQuestion()">1. Show Question</button>
            <button class="reveal-btn" onclick="revealStar()" style="background: #ffd700; color: #000;">2. Type & Reveal Star's Answer</button>
            
            <div style="display: flex; gap: 5px; margin: 5px 0;">
                <button class="reveal-btn" onclick="revealChoice('AGREE')" style="background: #10b981; color: #fff; flex: 1;">3a. Reveal AGREE</button>
                <button class="reveal-btn" onclick="revealChoice('DISAGREE')" style="background: #f43f5e; color: #fff; flex: 1;">3b. Reveal DISAGREE</button>
            </div>

            <button class="reveal-btn" onclick="revealTruth()">4. Reveal Actual Answer</button>
            <button class="action-btn danger" style="margin-top: 10px;" onclick="hideAllTexts()">Hide All Texts</button>
        </div>

        <!-- 5. Award Square & Reset -->
        <div class="panel-section">
            <h3>5. Award Square</h3>
            <button class="mark-btn btn-x" onclick="markSquare('X')">Mark X</button>
            <button class="mark-btn btn-o" onclick="markSquare('O')">Mark O</button>
            <button class="mark-btn clear-btn" onclick="markSquare('')">Clear Mark</button>
            <hr>
            <button class="action-btn danger" onclick="resetBoard()">Reset Entire Board</button>
        </div>
    </div>

    <script src="host.js"></script>
</body>
</html>
