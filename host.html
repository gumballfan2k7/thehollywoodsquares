<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host Controller Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- SheetJS CDN for parsing & generating Excel files -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="host-body">

    <h1>🎙️ HOST CONTROLLER PANEL</h1>

    <div class="host-container">
        
        <!-- 1. Turn Selection -->
        <div class="panel-section">
            <h3>1. Turn Selection</h3>
            <button id="btn-turn-x" class="btn-x btn-active" onclick="setTurn('X')" style="width: 48%;">Player X (Purple)</button>
            <button id="btn-turn-o" class="btn-o" onclick="setTurn('O')" style="width: 48%;">Player O (Yellow)</button>
        </div>

        <!-- 2. Star Names Definition -->
        <div class="panel-section">
            <h3>2. Set Star Names on Board</h3>
            <div class="host-grid">
                <input type="text" id="name-0" class="name-input" placeholder="1. Top Left">
                <input type="text" id="name-1" class="name-input" placeholder="2. Top Mid">
                <input type="text" id="name-2" class="name-input" placeholder="3. Top Right">
                <input type="text" id="name-3" class="name-input" placeholder="4. Mid Left">
                <input type="text" id="name-4" class="name-input" placeholder="5. Center">
                <input type="text" id="name-5" class="name-input" placeholder="6. Mid Right">
                <input type="text" id="name-6" class="name-input" placeholder="7. Bot Left">
                <input type="text" id="name-7" class="name-input" placeholder="8. Bot Mid">
                <input type="text" id="name-8" class="name-input" placeholder="9. Bot Right">
            </div>
            <button class="action-btn" style="background: #3b82f6; color: white; width: 100%; margin-top: 10px;" onclick="pushStarNames()">📺 Push Names to TV</button>
        </div>

        <!-- 3. Pick Square -->
        <div class="panel-section">
            <h3>3. Pick Square to Highlight</h3>
            <div class="host-grid">
                <button class="sq-btn" onclick="selectSquare(0)">Square 1</button>
                <button class="sq-btn" onclick="selectSquare(1)">Square 2</button>
                <button class="sq-btn" onclick="selectSquare(2)">Square 3</button>
                <button class="sq-btn" onclick="selectSquare(3)">Square 4</button>
                <button class="sq-btn" onclick="selectSquare(4)">Square 5</button>
                <button class="sq-btn" onclick="selectSquare(5)">Square 6</button>
                <button class="sq-btn" onclick="selectSquare(6)">Square 7</button>
                <button class="sq-btn" onclick="selectSquare(7)">Square 8</button>
                <button class="sq-btn" onclick="selectSquare(8)">Square 9</button>
            </div>
            <button class="action-btn clear-glow" onclick="clearGlow()">Turn Off Glow</button>
        </div>

        <!-- 4. Question Content & Excel Template -->
        <div class="panel-section">
            <h3>4. Question Content</h3>
            
            <div style="background: #2b2b3d; padding: 10px; border-radius: 6px; margin-bottom: 10px;">
                <label><strong>1. Get Excel Template:</strong></label>
                <button type="button" onclick="downloadTemplate()" style="background: #10b981; color: #fff; width: 100%; margin: 5px 0 10px 0;">📥 Download Excel Template (.xlsx)</button>
                
                <label><strong>2. Upload Completed Excel File:</strong></label>
                <input type="file" id="excel-input" accept=".xlsx, .xls" onchange="handleExcelUpload(event)">
            </div>

            <label>Select Loaded Question:</label>
            <select id="question-select" onchange="loadSelectedQuestion()">
                <option value="">-- Download template above or type manually --</option>
            </select>

            <label>Trivia Question:</label>
            <textarea id="input-q" rows="2" placeholder="e.g. What color is polar bear skin?"></textarea>

            <label>Actual True Answer:</label>
            <input type="text" id="input-truth" placeholder="e.g. Black!">

            <hr>
            <label style="color: #ffd700; font-size: 1.1rem;"><strong>🎙️ Type Star's Live Answer:</strong></label>
            <input type="text" id="input-star" placeholder="Type what the star says live..." style="border: 2px solid #ffd700;">
        </div>

        <!-- 5. Screen Reveals -->
        <div class="panel-section">
            <h3>5. Screen Reveals</h3>
            <button class="reveal-btn" onclick="showQuestion()">1. Show Question</button>
            <button class="reveal-btn" onclick="revealStar()" style="background: #ffd700; color: #000;">2. Type & Reveal Star's Answer</button>
            
            <div style="display: flex; gap: 5px; margin: 5px 0;">
                <button class="reveal-btn" onclick="revealChoice('AGREE')" style="background: #10b981; color: #fff; flex: 1;">3a. Reveal AGREE</button>
                <button class="reveal-btn" onclick="revealChoice('DISAGREE')" style="background: #f43f5e; color: #fff; flex: 1;">3b. Reveal DISAGREE</button>
            </div>

            <button class="reveal-btn" onclick="revealTruth()">4. Reveal Actual Answer</button>
            <button class="action-btn danger" style="margin-top: 10px;" onclick="hideAllTexts()">Hide All Texts</button>
        </div>

        <!-- 6. Award Square & Reset -->
        <div class="panel-section">
            <h3>6. Award Square</h3>
            <button class="mark-btn btn-x" onclick="markSquare('X')">Mark X</button>
            <button class="mark-btn btn-o" onclick="markSquare('O')">Mark O</button>
            <button class="mark-btn clear-btn" onclick="markSquare('')">Clear Mark</button>
            <hr>
            <button class="action-btn danger" onclick="resetBoard()">Reset Entire Board</button>
        </div>
    </div>

    <script src="host.js"></script>
</body>
</html>
